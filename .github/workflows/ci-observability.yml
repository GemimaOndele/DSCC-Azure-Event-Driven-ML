name: DSCC observability checks (offline)
on:
  pull_request:
    paths:
      - 'infra/observability.sh'
      - 'infra/trigger-alert.sh'
      - 'tests/observability/**'
      - '.github/workflows/ci-observability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n infra/observability.sh && bash -n infra/trigger-alert.sh
      - run: bash tests/observability/test_guards.sh
      - name: Confirm R4 contains no duplicate model or API
        run: test ! -d api && test ! -d model && test ! -f .github/workflows/ci-ml.yml
