name: CI - ML API and training

# Checks requested by the 24/11/2026 audits on PR #17 and PR #18.
# Shared verbatim across R1 and R4 branches to prevent integration conflicts.
# Full dataset-dependent training tests require documented permission.

on:
  push:
    branches: [feat/ml-api, feat/ml-training]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    if: github.ref == 'refs/heads/feat/ml-api' || github.head_ref == 'feat/ml-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt ruff==0.9.10
      - name: Lint API (ruff)
        run: python -m ruff check api
      - name: Run API tests
        run: python -m pytest api/tests -q
      - name: Build Docker image
        run: docker build -f api/Dockerfile -t churn-ml-api:1.0.0 .
      - name: Assert image size below 500 MB
        run: |
          set -euo pipefail
          SIZE=$(docker image inspect churn-ml-api:1.0.0 --format '{{.Size}}')
          echo "Docker image size: $SIZE bytes (limit 500000000)" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -lt 500000000

  training-tests:
    if: github.ref == 'refs/heads/feat/ml-training' || github.head_ref == 'feat/ml-training'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install training dependencies
        run: python -m pip install -r model/requirements.txt pytest==8.3.4 ruff==0.9.10
      - name: Lint training code (ruff)
        run: python -m ruff check model
      - name: Offline artifact and provenance checks (no case workbook download)
        run: python -m pytest model/tests/test_training.py -q -k 'test_committed_metrics_are_the_reference or test_onnx_artifact_is_the_shared_version or test_no_dataset_is_versioned or test_tampered_download_is_rejected'
      - name: Run full training and reproducibility tests only with permission
        if: vars.DATASET_USE_APPROVED == 'true'
        run: python -m pytest model/tests -q
      - name: Record pending permission
        if: vars.DATASET_USE_APPROVED != 'true'
        run: echo "Full dataset-dependent tests not executed; permission pending." >> "$GITHUB_STEP_SUMMARY"
