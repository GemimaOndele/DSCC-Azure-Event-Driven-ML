name: CI - Event pipeline
on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/ci-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r functions/requirements.txt pytest
      - run: python -m pytest functions/tests -q --junitxml=pipeline-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-tests
          path: pipeline-tests.xml
          if-no-files-found: warn
