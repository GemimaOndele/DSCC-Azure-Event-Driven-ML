name: DSCC observability checks (offline)
on:
  pull_request:
    paths:
      - 'infra/observability.sh'
      - 'infra/trigger-alert.sh'
      - 'tests/observability/**'
      - '.github/workflows/ci-observability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n infra/observability.sh infra/trigger-alert.sh
      - run: bash tests/observability/test_guards.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements-dev.txt ruff==0.9.10
      - run: python -m ruff check api
      - run: python -m pytest api/tests -q
      - run: docker build -f api/Dockerfile -t dscc-observability:ci .
