name: CI - ML API and training

# Checks requested by the 24/11/2026 audits on PR #17 and PR #18.
# The file is identical on feat/ml-api and feat/ml-training so the two merges
# do not produce a workflow conflict; each job runs only for its own PR.

on:
  push:
    branches: [feat/ml-api, feat/ml-training]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    if: github.ref == 'refs/heads/feat/ml-api' || github.head_ref == 'feat/ml-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run API tests
        run: python -m pytest api/tests -q
      - name: Build Docker image
        run: docker build -f api/Dockerfile -t churn-ml-api:1.0.0 .

  training-tests:
    if: github.ref == 'refs/heads/feat/ml-training' || github.head_ref == 'feat/ml-training'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install training dependencies
        run: python -m pip install -r model/requirements.txt pytest==8.3.4
      - name: Run training and reproducibility tests
        run: python -m pytest model/tests -q
