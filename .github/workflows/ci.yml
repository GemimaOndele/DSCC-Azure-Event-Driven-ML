name: DSCC integrated CI and optional GHCR
on:
  pull_request:
    paths:
      - 'api/**'
      - 'model/**'
      - 'functions/**'
      - 'tests/e2e/**'
      - 'web/**'
      - 'tests/dashboard/**'
      - 'tests/observability/**'
      - 'infra/observability.sh'
      - 'infra/trigger-alert.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/ci.yml .github/workflows/deploy.yml
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require integrated API on main
        if: github.ref == 'refs/heads/main'
        run: test -f api/Dockerfile && test -f model/features.json
      - uses: actions/setup-python@v5
        if: hashFiles('api/requirements-dev.txt') != ''
        with:
          python-version: '3.12'
      - name: Report API not yet integrated
        if: hashFiles('api/requirements-dev.txt') == ''
        run: echo 'API tests not executed - component absent on this branch' >> "$GITHUB_STEP_SUMMARY"
      - name: API tests
        if: hashFiles('api/requirements-dev.txt') != ''
        run: |
          python -m pip install -r api/requirements-dev.txt ruff==0.9.10
          python -m ruff check api
          python -m pytest api/tests -q --junitxml=api-tests.xml
      - name: Build container without publishing
        if: hashFiles('api/Dockerfile') != ''
        run: docker build -f api/Dockerfile -t dscc-api:ci .
      - name: Assert API image size below 500 MB
        if: hashFiles('api/Dockerfile') != ''
        run: |
          set -euo pipefail
          SIZE="$(docker image inspect dscc-api:ci --format '{{.Size}}')"
          echo "API image size: $SIZE bytes (limit 500000000)" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -lt 500000000
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('api-tests.xml') != ''
        with:
          name: api-tests
          path: api-tests.xml
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require integrated pipeline on main
        if: github.ref == 'refs/heads/main'
        run: test -f functions/requirements.txt && test -f functions/host.json
      - uses: actions/setup-python@v5
        if: hashFiles('functions/requirements.txt') != ''
        with:
          python-version: '3.12'
      - name: Report pipeline not yet integrated
        if: hashFiles('functions/requirements.txt') == ''
        run: echo 'Pipeline tests not executed - component absent on this branch' >> "$GITHUB_STEP_SUMMARY"
      - name: Pipeline tests
        if: hashFiles('functions/requirements.txt') != ''
        run: |
          python -m pip install -r functions/requirements.txt pytest ruff==0.9.10
          python -m ruff check functions
          python -m pytest functions/tests -q --junitxml=functions-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('functions-tests.xml') != ''
        with:
          name: functions-tests
          path: functions-tests.xml
  training:
    # Lint is independent of dataset access; download/retraining remains gated.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require integrated training on main
        if: github.ref == 'refs/heads/main'
        run: test -f model/train.py && test -f model/requirements.txt
      - uses: actions/setup-python@v5
        if: hashFiles('model/requirements.txt') != ''
        with:
          python-version: '3.12'
      - name: Offline training artifact and provenance checks
        if: hashFiles('model/requirements.txt') != ''
        run: |
          python -m pip install -r model/requirements.txt pytest ruff==0.9.10
          python -m ruff check model
          python -m pytest model/tests/test_training.py -q -k 'test_committed_metrics_are_the_reference or test_onnx_artifact_is_the_shared_version or test_no_dataset_is_versioned or test_tampered_download_is_rejected' --junitxml=training-offline.xml
      - name: Record missing permission
        if: hashFiles('model/requirements.txt') != '' && vars.DATASET_USE_APPROVED != 'true'
        run: echo 'Full dataset-dependent tests not executed - permission pending' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('training-offline.xml') != ''
        with:
          name: training-offline
          path: training-offline.xml
      - name: Training tests
        if: hashFiles('model/requirements.txt') != '' && vars.DATASET_USE_APPROVED == 'true'
        run: |
          python -m pip install -r model/requirements.txt pytest ruff==0.9.10
          python -m pytest model/tests -q --junitxml=training-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('training-tests.xml') != ''
        with:
          name: training-tests
          path: training-tests.xml
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require integration test on main
        if: github.ref == 'refs/heads/main'
        run: test -f tests/e2e/test_pipeline.py && test -f api/requirements-dev.txt && test -f functions/requirements.txt
      - name: Report incomplete integration
        if: hashFiles('tests/e2e/test_pipeline.py') == '' || hashFiles('api/requirements-dev.txt') == '' || hashFiles('functions/requirements.txt') == ''
        run: echo 'Integrated E2E not executed - components are not yet assembled' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        if: hashFiles('tests/e2e/test_pipeline.py') != '' && hashFiles('api/requirements-dev.txt') != '' && hashFiles('functions/requirements.txt') != ''
        with:
          python-version: '3.12'
      - name: Real ONNX integration tests
        if: hashFiles('tests/e2e/test_pipeline.py') != '' && hashFiles('api/requirements-dev.txt') != '' && hashFiles('functions/requirements.txt') != ''
        run: |
          python -m pip install -r api/requirements-dev.txt -r functions/requirements.txt
          python -m pytest tests/e2e/test_pipeline.py -q --junitxml=integration-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('integration-tests.xml') != ''
        with:
          name: integration-tests
          path: integration-tests.xml
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require dashboard tests on main
        if: github.ref == 'refs/heads/main'
        run: test -f tests/dashboard/test_data.cjs && test -f web/data.js
      - uses: actions/setup-node@v4
        if: hashFiles('tests/dashboard/test_data.cjs') != ''
        with:
          node-version: '22'
      - name: Dashboard tests
        if: hashFiles('tests/dashboard/test_data.cjs') != ''
        run: node --check web/app.js && node --test tests/dashboard/test_data.cjs
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require observability tests on main
        if: github.ref == 'refs/heads/main'
        run: test -f tests/observability/test_guards.sh
      - name: Verify scripts against test doubles only
        if: hashFiles('tests/observability/test_guards.sh') != ''
        run: |
          bash -n infra/observability.sh
          bash -n infra/trigger-alert.sh
          bash tests/observability/test_guards.sh
  publish:
    needs: [workflow-lint, api, pipeline, training, integration, dashboard, observability]
    # The trained artifact has separate publication rights from the source data.
    # Retain human opt-in; do not infer authorization from a branch publication.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GHCR == 'true' && vars.MODEL_ARTIFACT_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish version and commit tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/churn-api"
          VERSION="$(python -c 'import json; print(json.load(open("model/features.json"))["model_version"])')"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f api/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$GITHUB_SHA" .
          SIZE="$(docker image inspect "$IMAGE:$VERSION" --format '{{.Size}}')"
          test "$SIZE" -lt 500000000
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          printf 'Image: %s\nSize: %s bytes\nCommit: %s\n' "$DIGEST" "$SIZE" "$GITHUB_SHA" > release-evidence.txt
          cat release-evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence.txt
