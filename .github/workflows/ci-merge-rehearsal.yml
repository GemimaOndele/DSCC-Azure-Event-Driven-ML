name: DSCC pairwise merge rehearsal
on:
  pull_request:
    paths:
      - 'tests/e2e/rehearse_merges.py'
      - '.github/workflows/ci-merge-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    env:
      PR22_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Simulate pairwise integrations (no commit or push)
        env:
          DSCC_REPORT_DIR: ${{ runner.temp }}/dscc-evidence
        run: |
          git --version
          python tests/e2e/rehearse_merges.py
          cat "$DSCC_REPORT_DIR/merge-rehearsal.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-rehearsal
          path: |
            ${{ runner.temp }}/dscc-evidence/merge-rehearsal.json
            ${{ runner.temp }}/dscc-evidence/merge-rehearsal.md
