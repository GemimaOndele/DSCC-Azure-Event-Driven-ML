name: DSCC integrated CI and optional GHCR
on:
  pull_request:
    paths:
      - 'api/**'
      - 'model/**'
      - 'functions/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require integrated API on main
        if: github.ref == 'refs/heads/main'
        run: test -f api/Dockerfile && test -f model/features.json
      - uses: actions/setup-python@v5
        if: hashFiles('api/requirements-dev.txt') != ''
        with:
          python-version: '3.12'
      - name: API tests
        if: hashFiles('api/requirements-dev.txt') != ''
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pytest api/tests -q --junitxml=api-tests.xml
      - name: Build container without publishing
        if: hashFiles('api/Dockerfile') != ''
        run: docker build -f api/Dockerfile -t dscc-api:ci .
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('api-tests.xml') != ''
        with:
          name: api-tests
          path: api-tests.xml
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require integrated pipeline on main
        if: github.ref == 'refs/heads/main'
        run: test -f functions/requirements.txt && test -f functions/host.json
      - uses: actions/setup-python@v5
        if: hashFiles('functions/requirements.txt') != ''
        with:
          python-version: '3.12'
      - name: Pipeline tests
        if: hashFiles('functions/requirements.txt') != ''
        run: |
          python -m pip install -r functions/requirements.txt pytest
          python -m pytest functions/tests -q --junitxml=functions-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('functions-tests.xml') != ''
        with:
          name: functions-tests
          path: functions-tests.xml
  training:
    # Do not download the third-party dataset without documented permission.
    if: vars.DATASET_USE_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require integrated training on main
        if: github.ref == 'refs/heads/main'
        run: test -f model/train.py && test -f model/requirements.txt
      - uses: actions/setup-python@v5
        if: hashFiles('model/requirements.txt') != ''
        with:
          python-version: '3.12'
      - name: Training tests
        if: hashFiles('model/requirements.txt') != ''
        run: |
          python -m pip install -r model/requirements.txt pytest
          python -m pytest model/tests -q --junitxml=training-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('training-tests.xml') != ''
        with:
          name: training-tests
          path: training-tests.xml
  publish:
    needs: [api, pipeline, training]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GHCR == 'true' && vars.DATASET_USE_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish version and commit tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/churn-api"
          VERSION="$(python -c 'import json; print(json.load(open("model/features.json"))["model_version"])')"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f api/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$GITHUB_SHA" .
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          echo "Published $IMAGE:sha-$GITHUB_SHA and $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
