name: CI - ML API and training

# Checks requested by the 24/11/2026 audits on PR #17 and PR #18.
# Kept identical on feat/ml-api and feat/ml-training until the 24/11/2026
# provenance review; only the training job gained explicit clean-room steps.
# The api job is unchanged and each job runs only for its own PR.

on:
  push:
    branches: [feat/ml-api, feat/ml-training]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    if: github.ref == 'refs/heads/feat/ml-api' || github.head_ref == 'feat/ml-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run API tests
        run: python -m pytest api/tests -q
      - name: Build Docker image
        run: docker build -f api/Dockerfile -t churn-ml-api:1.0.0 .

  training-tests:
    if: github.ref == 'refs/heads/feat/ml-training' || github.head_ref == 'feat/ml-training'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install training dependencies
        run: python -m pip install -r model/requirements.txt pytest==8.3.4
      - name: Assert clean checkout (no dataset is versioned or pre-existing)
        run: |
          test -z "$(git ls-files -- 'data/*' 'Customer_Churn_Dataset.xlsx' 'model/test_split.csv')"
          test ! -e data/raw/02-Churn-Dataset.xlsx
          test ! -e data/processed/churn_dataset.csv
      - name: Download, verify SHA-256 and prepare dataset
        run: python model/prepare_data.py
      - name: Run training and reproducibility tests
        run: python -m pytest model/tests -q
