name: Publish churn API image to GHCR

# Issue #5 / PDF section 4.2: the image is built by GitHub Actions and published
# to GHCR with both the semantic version and the commit SHA. No secret is used
# beyond the short-lived GITHUB_TOKEN (packages: write only).
# This workflow is deliberately scoped to the R1 branch; the integrated
# .github/workflows/ci.yml proposed in PR #23 can supersede it once merged.

on:
  push:
    branches: [feat/ml-api]
    paths:
      - 'api/**'
      - 'model/model-1.0.0.onnx'
      - 'model/features.json'
      - '.github/workflows/publish-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/feat/ml-api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Validate the API before publishing
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pytest api/tests -q
      - name: Build, verify and publish version + SHA tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/churn-api"
          VERSION="$(python -c 'import json; print(json.load(open("model/features.json"))["model_version"])')"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          docker build -f api/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$GITHUB_SHA" .
          SIZE="$(docker image inspect "$IMAGE:$VERSION" --format '{{.Size}}')"
          echo "Image size: $SIZE bytes (limit 500000000)" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -lt 500000000
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          DIGEST="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          echo "Published $IMAGE:$VERSION and $IMAGE:sha-$GITHUB_SHA ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"
